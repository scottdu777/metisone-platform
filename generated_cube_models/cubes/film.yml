cubes:
  - name: film
    sql_table: public.film
    data_source: default

    joins:
      - name: film_category
        sql: "{CUBE}.film_id = {film_category}.film_id"
        relationship: one_to_many

    dimensions:
      - name: film_id
        sql: film_id
        type: number
        primary_key: true
        public: true

      - name: title
        sql: title
        type: string

      - name: description
        sql: description
        type: string

      - name: release_year
        sql: release_year
        type: number

      - name: language_id
        sql: language_id
        type: number

      - name: rental_duration
        sql: rental_duration
        type: number

      - name: rental_rate
        sql: rental_rate
        type: number

      - name: length
        sql: length
        type: number

      - name: replacement_cost
        sql: replacement_cost
        type: number

      - name: rating
        sql: rating
        type: string

      - name: special_features
        sql: "CAST({CUBE}.special_features AS TEXT)"
        type: string

      - name: fulltext
        sql: "CAST({CUBE}.fulltext AS TEXT)"
        type: string

      - name: last_update
        sql: last_update
        type: time

    measures:
      - name: count
        type: count
        title: Film Count
        description: Number of films

    pre_aggregations: []
