[project]
name = "metisone-ai-platform"
version = "0.1.0"
description = "Modular AI knowledge platform core providers and query orchestrator."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]
service = ["fastapi>=0.115.0", "python-dotenv>=1.0.0", "uvicorn[standard]>=0.30.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
