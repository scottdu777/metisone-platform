cubes:
  - name: film_category
    sql_table: public.film_category
    data_source: default

    joins:
      - name: category
        sql: "{CUBE}.category_id = {category}.category_id"
        relationship: many_to_one

      - name: film
        sql: "{CUBE}.film_id = {film}.film_id"
        relationship: many_to_one

    dimensions:
      - name: film_category_id
        sql: "CONCAT(CAST({CUBE}.film_id AS TEXT), '-', CAST({CUBE}.category_id AS TEXT))"
        type: string
        primary_key: true

      - name: film_id
        sql: film_id
        type: number

      - name: category_id
        sql: category_id
        type: number

      - name: last_update
        sql: last_update
        type: time

    measures:
      - name: count
        type: count
        title: Film Category Link Count
        description: Number of film-to-category relationships

      - name: films_count
        sql: film_id
        type: count_distinct
        title: Distinct Films Count
        description: Use this measure to count distinct films by category, including questions such as how many films are in the Action category

      - name: categories_count
        sql: category_id
        type: count_distinct
        title: Distinct Categories Count
        description: Use this measure to count distinct categories by film

    pre_aggregations: []
